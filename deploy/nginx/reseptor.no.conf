server {
    listen 80;
    listen [::]:80;
    server_name www.reseptor.no;

    return 301 https://reseptor.no$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name reseptor.no;

    root /var/www/reseptor.no/current;
    index index.html;

    access_log /var/log/nginx/reseptor.no.access.log;
    error_log /var/log/nginx/reseptor.no.error.log;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.svg {
        access_log off;
        log_not_found off;
    }
}
